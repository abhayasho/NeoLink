[package]
name = "neolink"
description = "NeoLink: a GPU-rendered coding workspace (terminal, editor, explorer, agents)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
neolink-core = { path = "../neolink-core" }
neolink-nvim = { path = "../neolink-nvim" }
neolink-acp = { path = "../neolink-acp" }
winit = "0.30.13"
wgpu = "30"
cosmic-text = "0.19"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
parking_lot = "0.12"
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
arboard = { version = "3", default-features = false }
png = "0.18"
trash = "5"
rfd = { version = "0.15", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-metal = "0.3"
objc2-core-foundation = "0.3"
objc2-pdf-kit = "0.3"
block2 = "0.6"
muda = { version = "0.17", default-features = false }

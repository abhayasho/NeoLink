[workspace]
resolver = "2"
members = ["crates/neolink-core", "crates/neolink-nvim", "crates/neolink-acp", "crates/neolink"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'assets/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  # On Windows this establishes that the app compiles and links with MSVC, the tests pass (the editor
  # client's against a real Neovim), the downloads are packaged and both installers work, including a
  # launch of the installed app that draws a frame. It says nothing about smoothness or latency there.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      # The editor tests drive a real Neovim; they skip themselves where `nvim` is missing.
      - name: Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim
      - name: Neovim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install neovim -y --no-progress
          $nvim = Get-ChildItem -Path 'C:\tools\neovim','C:\Program Files\Neovim' -Recurse -Filter nvim.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nvim) { $nvim.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append; & $nvim.FullName --version | Select-Object -First 1 }
      - name: Build
        run: cargo build --workspace --release --locked
      # The code builds without warnings on both systems; keep it that way (a separate target folder,
      # so the release build above is not rebuilt with different flags).
      - name: No warnings
        run: cargo check --workspace --all-targets --locked
        env:
          RUSTFLAGS: -D warnings
          CARGO_TARGET_DIR: target/lint
      - name: Tests
        run: cargo test --workspace --locked
      - name: Editor runtime (neolink.lua against Neovim)
        if: runner.os == 'macOS'
        run: |
          python3 scripts/test-editor.py
          python3 scripts/test-editor-messages.py
      - name: Windows archive layout tests
        run: python scripts/test-package-windows.py
      - name: Package for Windows
        if: runner.os == 'Windows'
        run: python scripts/package-windows.py
      - name: Setup program for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          } else { $iscc = $iscc.Source }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Expand-Archive target\NeoLink-windows-x64.zip target\windows-package -Force
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\target\windows-package\NeoLink" "/DOutputDir=$PWD\target" scripts\windows\NeoLink.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package-windows.py --checksum-only target/NeoLink-Setup-x64.exe
      # Both installers, end to end on the runner: install (install.ps1 through `irm | iex`), launch the
      # installed app and capture a frame from its window, update, uninstall; then the same with the
      # setup program.
      - name: Windows installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-windows-installer.ps1 -Archive target/NeoLink-windows-x64.zip -Setup target/NeoLink-Setup-x64.exe
      - name: Package for macOS and test the installer
        if: runner.os == 'macOS'
        run: |
          scripts/build-app.sh
          scripts/package-release.sh
          python3 scripts/test-installer.py
      - name: Upload the macOS download
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeoLink-macos-arm64
          path: target/release-assets/
          if-no-files-found: error
      - name: Upload the Windows download
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NeoLink-windows-x64
          path: |
            target/NeoLink-windows-x64.zip
            target/NeoLink-windows-x64.zip.sha256
            target/NeoLink-Setup-x64.exe
            target/NeoLink-Setup-x64.exe.sha256
          if-no-files-found: error

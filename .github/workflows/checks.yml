name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install editor runtime
        run: brew list neovim >/dev/null 2>&1 || brew install neovim
      - name: Native regression tests
        run: swift test
      - name: Editor runtime regression
        run: python3 scripts/test-editor.py
      - name: Offline benchmark validation
        run: python3 scripts/test-benchmark.py
      - name: Package release app
        run: ./scripts/build-app.sh
      - name: Verify packaged resources and signature
        run: python3 scripts/verify-app.py NeoLink.app

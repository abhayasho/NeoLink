name: macOS checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'assets/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'assets/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install coding runtimes
        run: brew install neovim ripgrep pyright
      - name: Editor runtime regression
        run: python3 scripts/test-editor.py
      - name: Offline benchmark validation
        run: python3 scripts/test-benchmark.py
      - name: Native regression tests
        run: swift test
      - name: Agent transport on a constrained task pool
        run: |
          neolink_test_bundle="$(swift build --show-bin-path)/NeoLinkPackageTests.xctest"
          LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 xcrun xctest -XCTest NeoLinkTests.ACPTests "$neolink_test_bundle"
      - name: Package release app
        run: ./scripts/build-app.sh
      - name: Verify packaged resources and signature
        run: python3 scripts/verify-app.py NeoLink.app
      - name: Verify downloadable app and installer
        run: |
          ./scripts/package-release.sh
          python3 scripts/test-installer.py

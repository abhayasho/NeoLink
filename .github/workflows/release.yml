name: Release
# Pushing a tag like v2.0.0 builds, tests and packages both downloads and attaches them to a draft
# release of that name (created with docs/releases/<tag>.md as its notes if it does not exist yet).
# Publishing the draft (and marking it latest) stays a person's decision.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            asset: target/release-assets/*
          - os: windows-latest
            asset: |
              target/NeoLink-windows-x64.zip
              target/NeoLink-windows-x64.zip.sha256
              target/NeoLink-Setup-x64.exe
              target/NeoLink-Setup-x64.exe.sha256
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Neovim (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim
      - name: Tests
        run: cargo test --workspace --locked
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          scripts/build-app.sh
          scripts/package-release.sh
          python3 scripts/test-installer.py
      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          cargo build --release -p neolink --locked
          python scripts/package-windows.py
      - name: Setup program for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          } else { $iscc = $iscc.Source }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Expand-Archive target\NeoLink-windows-x64.zip target\windows-package -Force
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\target\windows-package\NeoLink" "/DOutputDir=$PWD\target" scripts\windows\NeoLink.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package-windows.py --checksum-only target/NeoLink-Setup-x64.exe
      # Both installers, end to end on the runner: install (install.ps1 through `irm | iex`), launch the
      # installed app and capture a frame from its window, update, uninstall; then the same with the
      # setup program.
      - name: Windows installer tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-windows-installer.ps1 -Archive target/NeoLink-windows-x64.zip -Setup target/NeoLink-Setup-x64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
  publish-draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # Not "assets": that is the repository's own image folder in this checkout.
          path: release-downloads
          merge-multiple: true
      - name: Attach the downloads to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la release-downloads
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes="docs/releases/$TAG.md"
            [ -f "$notes" ] || notes=/dev/null
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "NeoLink ${TAG#v}" --notes-file "$notes"
          fi
          gh release upload "$TAG" release-downloads/* --repo "$GITHUB_REPOSITORY" --clobber
